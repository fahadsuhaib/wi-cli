[package]
name = "wi-audio"
version = "0.1.0"
edition = "2024"
description = "Voice dictation engine for wi: microphone, phrase detection and local speech-to-text (Moonshine). Separate from wi on purpose."
license = "MIT"
repository = "https://github.com/fahadsuhaib/wi-cli"
publish = false

[[bin]]
name = "wi-audio"
path = "src/main.rs"

[dependencies]
transcribe-cpp = { version = "0.4.1", default-features = false }
cpal = "0.18.2"
hound = "3.5.1"
sha2 = "0.11.1"
serde_json = "1.0.154"
dirs = "7.0.0"
libc = "0.2.191"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Not part of wi's build: its own lockfile and target folder.
[workspace]
