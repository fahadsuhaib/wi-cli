[package]
name = "wicli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "7.0.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
russh = "0.65.0"
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "signal", "io-std", "net"] }
toml = "1.1.8"
vt100 = "0.18.1"

[[bin]]
name = "wi"
path = "src/main.rs"
