name: CI

# Layout, built for speed: the slow part is the terminal (pty) scripts, which mostly wait on a real
# pseudo-terminal, so they run in parallel shards on separate machines against one shared debug build.
#
#   build      -> compile once, lint, unit tests; uploads the binary          (~3 min, gates everything)
#   pty        -> 4 shards of the terminal scripts, local and remote          (~6-8 min each, in parallel)
#   macos      -> build, lint, unit tests on macOS                            (~3 min, runs in parallel)
#   macos-pty  -> terminal scripts on macOS, informational only               (does not fail the run)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # fetch the repository
      - uses: dtolnay/rust-toolchain@stable # stable Rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2 # cache cargo registry and target
      - name: Build
        run: cargo build
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit and CLI tests
        run: cargo test
      - name: Keep the binary for the terminal test shards
        uses: actions/upload-artifact@v4 # one build shared by all shards
        with:
          name: wi-debug
          path: target/debug/wi
          if-no-files-found: error
          retention-days: 1

  pty:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4 # the scripts live in dev/
      - name: Get the binary built above
        uses: actions/download-artifact@v4 # no second compile
        with:
          name: wi-debug
          path: target/debug
      - name: Make the binary executable
        run: chmod +x target/debug/wi && target/debug/wi --version
      - name: Install tools used by the pty tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv vim git tmux ripgrep zsh openssh-client procps
      - name: Python venv with pyte
        run: |
          python3 -m venv "$RUNNER_TEMP/scratch/venv"
          "$RUNNER_TEMP/scratch/venv/bin/pip" install pyte
      - name: Generate the test SSH key
        run: ssh-keygen -t ed25519 -N "" -f dev/id_test -C wicli-ci
      - name: Start the remote test box
        run: |
          docker build -t devbox-test dev
          docker run -d --name devbox-test -p 2222:22 devbox-test
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/2222) 2>/dev/null; then echo "test box is up"; exit 0; fi
            sleep 1
          done
          docker logs devbox-test
          echo "test box did not answer on port 2222" >&2
          exit 1
      - name: Write test.toml
        run: |
          S="$RUNNER_TEMP/scratch"
          mkdir -p "$S/ws"
          cat > "$S/test.toml" <<EOF
          [[box]]
          name = "test"
          host = "127.0.0.1"
          port = 2222
          user = "dev"
          identity = "$GITHUB_WORKSPACE/dev/id_test"
          known_hosts = "$S/known_hosts"
          EOF
      - name: Terminal scripts, shard ${{ matrix.shard }} of 4
        env:
          SKIP_BUILD: "1"
          SHARD: ${{ matrix.shard }}/4
        run: bash dev/run_tests.sh "$RUNNER_TEMP/scratch" 2>&1 | tee "$RUNNER_TEMP/tests.log"; exit "${PIPESTATUS[0]}"
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4 # keep the full test log of this shard
        with:
          name: pty-log-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/tests.log
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # fetch the repository
      - uses: dtolnay/rust-toolchain@stable # stable Rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2 # cache cargo registry and target
      - name: Build
        run: cargo build
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit and CLI tests
        run: cargo test

  # The terminal scripts on a hosted Mac are informational for now: they were developed on a Mac but
  # have not been proven on hosted runners. Job-level continue-on-error keeps the run green if they
  # fail; drop it once they are known to pass.
  macos-pty:
    runs-on: macos-latest
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4 # fetch the repository
      - uses: dtolnay/rust-toolchain@stable # stable Rust
      - uses: Swatinem/rust-cache@v2 # cache cargo registry and target
      - name: Build
        run: cargo build
      - name: Python venv with pyte
        run: |
          python3 -m venv "$RUNNER_TEMP/scratch/venv"
          "$RUNNER_TEMP/scratch/venv/bin/pip" install pyte
          mkdir -p "$RUNNER_TEMP/scratch/ws"
          printf '[[box]]\nname = "test"\nhost = "127.0.0.1"\nport = 2222\nuser = "dev"\nidentity = "/nonexistent"\nknown_hosts = "%s/known_hosts"\n' "$RUNNER_TEMP/scratch" > "$RUNNER_TEMP/scratch/test.toml"
      - name: Local-mode terminal scripts, shard ${{ matrix.shard }} of 2
        env:
          SKIP_BUILD: "1"
          SHARD: ${{ matrix.shard }}/2
        run: bash dev/run_tests.sh "$RUNNER_TEMP/scratch"
